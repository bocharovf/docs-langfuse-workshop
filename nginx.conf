server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # llms.txt, sitemap.xml и прочие text-файлы отдаём в UTF-8,
    # иначе браузер гадает кодировку и ломает кириллицу.
    charset utf-8;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
